<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f6dff">
    <title>DevAltum POS - Customer Profile</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="app-container">
    <section class="view-screen no-bottom-nav" id="view-customer-profile">
        <!-- Top App Header -->
        <header class="app-header">
            <button type="button" class="header-action-btn" onclick="navigateTo('customers')">
                <span class="material-symbols-rounded">arrow_back_ios_new</span>
            </button>
            <div class="header-title-text" style="font-size:18px; font-weight: 700;">Customer Profile</div>
            <button type="button" class="header-action-btn" onclick="refreshCurrentCustomerProfile()" title="Refresh Profile">
                <span class="material-symbols-rounded">sync</span>
            </button>
        </header>

        <!-- Scrollable Customer Ledger Content -->
        <div class="view-scroll-content" style="padding:14px 14px 20px 14px;">
            <!-- 1. Customer Hero Blue Banner Card -->
            <div class="customer-hero-blue-banner">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="customer-avatar-glass" id="cust-profile-avatar">H</div>
                    <div>
                        <div style="font-size:18.5px; font-weight: 700; color:#fff; letter-spacing:0.2px;" id="cust-profile-name">Hamad</div>
                        <div style="font-size:12.5px; color:#dbeafe; font-weight:700; display:flex; align-items:center; gap:4px; margin-top:2px;">
                            <span class="material-symbols-rounded" style="font-size:14px;">call</span>
                            <span id="cust-profile-phone">030012012321</span>
                        </div>
                    </div>
                </div>

                <!-- Glass Address Pill -->
                <div class="customer-address-glass-pill">
                    <span class="material-symbols-rounded" style="font-size:16px;">location_on</span>
                    <span id="cust-profile-address">Hussain Khan Wala Ch 8 Pattoki</span>
                </div>

                <!-- Action Buttons: WhatsApp & Direct Call -->
                <div class="customer-action-btn-row">
                    <a id="cust-profile-wa-btn" href="#" target="_blank" class="btn-cust-wa-green">
                        <svg style="width:18px; height:18px; fill:currentColor; flex-shrink:0;" viewBox="0 0 24 24">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.05 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                        </svg>
                        <span>WhatsApp</span>
                    </a>
                    <a id="cust-profile-call-btn" href="#" class="btn-cust-call-navy">
                        <span class="material-symbols-rounded" style="font-size:18px;">call</span>
                        <span>Call</span>
                    </a>
                </div>
            </div>

            <!-- 2. Financial Ledger 3-Card Summary Row -->
            <div class="cust-ledger-summary-grid">
                <!-- Purchases -->
                <div class="cust-ledger-box">
                    <div style="font-size:11px; font-weight: 700; color:#64748b;">Purchases</div>
                    <div style="font-size:14.5px; font-weight: 700; color:#0f172a; margin:3px 0;" id="cust-profile-purchases">Rs 3,000</div>
                    <div style="font-size:10.5px; color:#64748b; font-weight:700;" id="cust-profile-orders-count">2 orders</div>
                </div>

                <!-- Total Paid -->
                <div class="cust-ledger-box">
                    <div style="font-size:11px; font-weight: 700; color:#16a34a;">Total Paid</div>
                    <div style="font-size:14.5px; font-weight: 700; color:#16a34a; margin:3px 0;" id="cust-profile-paid">Rs 1,000</div>
                    <div style="font-size:10.5px; color:#16a34a; font-weight: 700;">Cleared</div>
                </div>

                <!-- Baqaya -->
                <div class="cust-ledger-box baqaya">
                    <div style="font-size:11px; font-weight: 700; color:#ea580c;">Baqaya</div>
                    <div style="font-size:14.5px; font-weight: 700; color:#ea580c; margin:3px 0;" id="cust-profile-due">Rs 2,000</div>
                    <div style="font-size:10.5px; color:#ea580c; font-weight: 700;">Balance Due</div>
                </div>
            </div>

            <!-- 3. Purchase History Section -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 2px;">
                <div style="font-size:14.5px; font-weight: 700; color:#0f172a;">Purchase History</div>
                <div style="font-size:12px; color:#64748b; font-weight: 700;" id="cust-profile-history-badge">2 invoices</div>
            </div>

            <!-- Invoices List Mount -->
            <div id="cust-profile-invoices-list">
                <!-- Dynamically populated via app.js -->
            </div>
        </div>
    </section>
</div>

<!-- Global Modals & Toast -->
<div id="app-modal-container"></div>
<div class="app-toast-container" id="app-toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/modals.js"></script>
<script src="../js/router.js"></script>
<script src="../js/app.js"></script>
<script>
    function refreshCurrentCustomerProfile() {
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('id');
        if (customerId && typeof viewCustomerProfile === 'function') {
            viewCustomerProfile(customerId);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('id');
        if (customerId && typeof viewCustomerProfile === 'function') {
            viewCustomerProfile(customerId);
        }
    });
</script>
</body>
</html>
