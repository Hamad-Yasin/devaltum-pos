<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f6dff">
    <title>DevAltum POS - Products</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="app-container">
    <section class="view-screen" id="view-products">
        <header class="app-header">
            <button type="button" class="header-action-btn" onclick="navigateTo('dashboard')">
                <span class="material-symbols-rounded">arrow_back_ios_new</span>
            </button>
            <div class="header-title-text">Products Directory</div>
            <button type="button" class="header-action-btn" onclick="fetchProducts()">
                <span class="material-symbols-rounded">sync</span>
            </button>
        </header>

        <!-- Search Bar -->
        <div style="padding:12px 16px 0 16px;">
            <div style="position:relative;">
                <span class="material-symbols-rounded" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:20px;">search</span>
                <input type="text" id="products-search-input" placeholder="Search products by name, SKU or barcode..." oninput="handleProductSearch(this.value)" style="width:100%; padding:11px 12px 11px 38px; border-radius:16px; border:1.5px solid #e2e8f0; background:#fff; font-size:13px; outline:none; box-shadow:0 2px 6px rgba(0,0,0,0.03);">
            </div>
        </div>

        <div style="padding: 10px 16px 0 16px;">
            <button type="button" class="btn-primary-action-block" style="padding:13px; margin:0; font-size:14px; font-weight: 700; display:flex; align-items:center; justify-content:center; gap:8px;" onclick="navigateTo('add-product')">
                <span class="material-symbols-rounded" style="font-size:20px;">qr_code_scanner</span> Scan & Register New Product
            </button>
        </div>

        <!-- Products List -->
        <div class="view-scroll-content" id="products-list-mount">
            <!-- Dynamically populated via app.js -->
        </div>

        <!-- 5-Tab Floating Bottom Navigation Bar -->
        <nav class="app-bottom-nav">
            <button type="button" class="bottom-tab-link" onclick="navigateTo('dashboard')">
                <span class="material-symbols-rounded">home</span>
                <span>Home</span>
            </button>
            <button type="button" class="bottom-tab-link" onclick="navigateTo('sales')">
                <span class="material-symbols-rounded">receipt_long</span>
                <span>Sales</span>
            </button>
            <div class="nav-scanner-fab-wrap">
                <button type="button" class="nav-scanner-fab" onclick="navigateTo('scanner')" title="Scan Barcode">
                    <span class="material-symbols-rounded" style="font-size:26px;">qr_code_scanner</span>
                </button>
            </div>
            <button type="button" class="bottom-tab-link active" onclick="navigateTo('products')">
                <span class="material-symbols-rounded">inventory_2</span>
                <span>Products</span>
            </button>
            <button type="button" class="bottom-tab-link" onclick="navigateTo('profile')">
                <span class="material-symbols-rounded">person</span>
                <span>Profile</span>
            </button>
        </nav>
    </section>
</div>

<!-- Global Modals & Toast -->
<div id="app-modal-container"></div>
<div class="app-toast-container" id="app-toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/modals.js"></script>
<script src="../js/router.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
