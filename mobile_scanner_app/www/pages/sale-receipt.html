<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f6dff">
    <title>DevAltum POS - Sale Receipt</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="app-container">
    <section class="view-screen no-bottom-nav" id="view-sale-receipt">
        <header class="app-header">
            <button type="button" class="header-action-btn" onclick="navigateTo('sales')">
                <span class="material-symbols-rounded">arrow_back_ios_new</span>
            </button>
            <div class="header-title-text" id="receipt-screen-title">Sale Receipt</div>
            <button type="button" class="header-action-btn" onclick="refreshReceiptFrame()" title="Refresh Receipt">
                <span class="material-symbols-rounded">sync</span>
            </button>
        </header>

        <div class="receipt-screen-frame-container" style="flex:1; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; background:#f8fafc; padding: 0;">
            <iframe id="receipt-full-frame" src="" style="width:100%; height:100%; min-height:calc(100vh - 65px); border:none; background:#fff;"></iframe>
        </div>
    </section>
</div>

<!-- Global Modals & Toast -->
<div id="app-modal-container"></div>
<div class="app-toast-container" id="app-toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/modals.js"></script>
<script src="../js/router.js"></script>
<script src="../js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id');
        const invoiceNo = urlParams.get('no') || '';
        if (invoiceId && typeof viewSaleReceipt === 'function') {
            viewSaleReceipt(invoiceId, invoiceNo);
        }
    });
</script>
</body>
</html>
