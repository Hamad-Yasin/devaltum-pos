<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f6dff">
    <title>DevAltum POS - Welcome</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="app-container">
    <section class="view-screen no-bottom-nav" id="view-welcome">
        <div class="splash-hero-box">
            <div class="qr-hero-card-badge" style="background:transparent; box-shadow:none; border:none; width:200px; height:200px; margin-bottom:18px;">
                <img src="../assets/logo-transparent.png" alt="DevAltum POS Logo" style="width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 16px 36px rgba(14, 110, 255, 0.22));">
            </div>
            <h1 class="splash-title-text">DevAltum POS<br>Companion</h1>
            <p class="splash-subtitle-text">Wireless Scanner & Remote Dashboard</p>
        </div>

        <div style="width:100%; padding:20px;">
            <button type="button" class="btn-get-started-cta" onclick="navigateTo('connect')">
                <span>Connect Desktop POS</span>
                <span class="material-symbols-rounded">arrow_forward</span>
            </button>
            <button type="button" class="btn-neutral-outline" style="width:100%; margin-top:10px; padding:13px; font-weight:700; border-radius:16px; border:2px solid #e2e8f0; background:#ffffff; color:#0f6dff; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 14px rgba(15,109,255,0.06);" onclick="enableGuestMode(); navigateTo('dashboard');">
                <span class="material-symbols-rounded" style="font-size:19px; color:#0f6dff;">bolt</span>
                <span>Continue as Guest (Instant Demo)</span>
            </button>
            <div style="text-align:center; margin-top:14px; color:#94a3b8; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:5px;">
                <span>Powered by</span>
                <strong style="color:#0f6dff; font-weight: 700; letter-spacing:0.3px;">DevAltum</strong>
            </div>
        </div>
    </section>
</div>

<script src="../js/api.js"></script>
<script src="../js/router.js"></script>
</body>
</html>
