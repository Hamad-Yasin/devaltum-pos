<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Offline - DevAltum POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #020617;
            color: #fff;
            padding: 24px;
            text-align: center;
        }
        .icon {
            display: inline-block;
            width: 80px; height: 80px;
            background: rgba(15, 109, 255, 0.1);
            border-radius: 50%;
            display: grid; place-items: center;
            margin-bottom: 24px;
            color: #0f6dff;
        }
        h1 { font-size: 28px; line-height: 1.2; margin-bottom: 12px; font-weight: 800; letter-spacing: -0.5px; }
        p { color: #64748b; font-size: 16px; max-width: 400px; margin-bottom: 32px; line-height: 1.6; }
        .btn {
            background: #0f6dff;
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 16px rgba(15,109,255,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .footer { position: fixed; bottom: 30px; font-size: 13px; color: #475569; font-weight: 600; }
    </style>
</head>
<body>
    <div class="icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c2.8 0 5.3 1.1 7.2 2.84"/><path d="M14.01 9.07a5 5 0 0 1 3.19 1.1"/><path d="M19 13.91A10.5 10.5 0 0 1 20.42 16"/><path d="M2.38 10.87A10.4 10.4 0 0 1 4 8.7'/><path d="M4 16.92A10.5 10.5 0 0 1 2.38 14"/><path d="M6.02 12.06A4.97 4.97 0 0 1 7.2 9.87"/><path d="M6.71 16.71a5 5 0 0 1-1.39-3.32"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
    </div>
    <h1>You are offline</h1>
    <p>Please check your internet or local network connection to reconnect to the POS system. The app will automatically resume when connected.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    
    <div class="footer">Powered by DevAltum</div>
    
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
